<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pay Bill | XYZ Smart Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ===== GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      color: #222;
    }

    header {
      background: #203a43;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h3 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #2c5364;
      color: white;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .payment-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .upi { background: #00c853; }
    .card { background: #2979ff; }
    .cash { background: #ff6f00; }

    .pdf {
      background: #6a1b9a;
    }

    .success {
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 10px;
      text-align: center;
      display: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>💳 Final Bill & Payment — XYZ Smart Store</header>

<div class="container">

  <!-- ================= INVOICE AREA ================= -->
  <div id="invoice">
    <h3>📋 Bill Summary</h3>

    <table>
      <thead>
        <tr>
          <th>Sr</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Amount (₹)</th>
        </tr>
      </thead>
      <tbody id="billBody"></tbody>
    </table>

    <div class="total-box">
      <span>Total</span>
      <span id="totalAmount">₹0</span>
    </div>

    <p style="text-align:center;font-size:12px;">
      Thank you for shopping with XYZ Smart Store 🌱
    </p>
  </div>
  <!-- ================================================= -->

  <button class="payment-btn upi" onclick="completePayment('UPI')">📱 Pay via UPI</button>
  <button class="payment-btn card" onclick="completePayment('Card')">💳 Pay via Card</button>
  <button class="payment-btn cash" onclick="completePayment('Cash')">💵 Pay with Cash</button>

  <button class="payment-btn pdf" onclick="downloadInvoice()">📄 Download Invoice (PDF)</button>

  <div class="success" id="successMsg">
    ✅ Payment Successful! Invoice downloaded.
  </div>

</div>

<!-- Navigation -->
<script src="/js/navigation.js"></script>

<script>
  const billItems = JSON.parse(localStorage.getItem("bill")) || [];
  const total = localStorage.getItem("total") || 0;

  if (billItems.length === 0) {
    alert("No bill found");
    goToHomePage();
  }

  const tbody = document.getElementById("billBody");

  billItems.forEach((item, index) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${item.name}</td>
      <td>${item.qty}</td>
      <td>₹${item.qty * item.price}</td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("totalAmount").innerText = "₹" + total;

  function completePayment(method) {
    console.log("Payment:", method);
    document.getElementById("successMsg").style.display = "block";

    setTimeout(() => {
      localStorage.clear();
      goToHomePage();
    }, 3000);
  }

  function downloadInvoice() {
    const invoice = document.getElementById("invoice");

    html2pdf().set({
      margin: 0.5,
      filename: `XYZ_Invoice_${Date.now()}.pdf`,
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: "in", format: "a4", orientation: "portrait" }
    }).from(invoice).save();
  }
</script>

</body>
</html>
