<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pay Bill |   VISHAL Mega Mart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Js/supabase.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      background: #203a43;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #2c5364;
      color: white;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .warning {
      display: none;
      background: #fdecea;
      color: #b71c1c;
      border-left: 6px solid #d32f2f;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upi { background: #00c853; }
    .card { background: #2979ff; }
    .cash { background: #ff6f00; }
    .pdf { background: #6a1b9a; }
  </style>
</head>

<body>

<header>💳 Final Bill & Payment —  VISHAL Mega Mart</header>

<div class="container">

  <div id="invoice">
    <h3 style="text-align:center;">📋 Bill Summary</h3>

    <table>
      <thead>
        <tr>
          <th>Sr</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Amount (₹)</th>
        </tr>
      </thead>
      <tbody id="billBody"></tbody>
    </table>

    <div class="total-box">
      <span>Total</span>
      <span id="totalAmount">₹0</span>
    </div>

    <div class="status" id="statusText">
      ⏳ Waiting for ESP32 to verify weight...
    </div>

    <div class="warning" id="warningBox">
      ⚠️ Weight mismatch detected<br>
      Difference: <span id="diffValue">0</span> g
    </div>
  </div>

  <button class="btn upi" disabled>📱 Pay via UPI</button>
  <button class="btn card" disabled>💳 Pay via Card</button>
  <button class="btn cash" disabled>💵 Pay with Cash</button>
  <button class="btn pdf" onclick="downloadInvoice()">📄 Download Invoice</button>

</div>

<script>
  /* ===============================
     LOAD LOCAL DATA
  ================================ */
  const bill = JSON.parse(localStorage.getItem("bill")) || [];
  const total = localStorage.getItem("total");
  const SESSION_ID = localStorage.getItem("session_id");

  if (!SESSION_ID || bill.length === 0) {
    alert("Invalid session");
    location.href = "scan.html";
  }

  const tbody = document.getElementById("billBody");
  bill.forEach((item, i) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${item.name}</td>
      <td>${item.qty}</td>
      <td>₹${item.qty * item.price}</td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("totalAmount").innerText = "₹" + total;

  /* ===============================
     PAYMENT CONTROL
  ================================ */
  const buttons = document.querySelectorAll(".btn:not(.pdf)");
  const statusText = document.getElementById("statusText");
  const warningBox = document.getElementById("warningBox");
  const diffValue = document.getElementById("diffValue");

  function enablePayment() {
    buttons.forEach(b => b.disabled = false);
    statusText.innerText = "✅ Weight verified. You may proceed to payment.";
    warningBox.style.display = "none";
  }

  function disablePayment(diff) {
    buttons.forEach(b => b.disabled = true);
    warningBox.style.display = "block";
    diffValue.innerText = diff;
    statusText.innerText = "❌ Weight mismatch. Please contact staff.";
  }

  /* ===============================
     VALIDATION POLLING (SESSION BASED)
  ================================ */
  async function checkValidation() {
    const { data, error } = await supabase
      .from("validation")
      .select("verified,diff")
      .eq("session_id", SESSION_ID)
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();

    if (error || !data) return;

    if (data.verified) {
      enablePayment();
      clearInterval(validationTimer);
    } else {
      disablePayment(data.diff);
    }
  }

  const validationTimer = setInterval(checkValidation, 2000);

  /* ===============================
     PDF DOWNLOAD
  ================================ */
  function downloadInvoice() {
    html2pdf().from(document.getElementById("invoice")).save(
      `Invoice_${Date.now()}.pdf`
    );
  }
</script>

</body>
</html>
