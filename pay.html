<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pay Bill | XYZ Smart Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/Js/supabase.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
    }

    header {
      background: #203a43;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #2c5364;
      color: white;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .warning-box {
      display: none;
      background: #fdecea;
      color: #b71c1c;
      border-left: 6px solid #d32f2f;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .status-box {
      background: #e3f2fd;
      color: #0d47a1;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .payment-btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .payment-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upi { background: #00c853; }
    .card { background: #2979ff; }
    .cash { background: #ff6f00; }
    .pdf { background: #6a1b9a; }
  </style>
</head>

<body>

<header>💳 Final Bill & Payment — XYZ Smart Store</header>

<div class="container">

  <div id="invoice">
    <h3 style="text-align:center;">📋 Bill Summary</h3>

    <table>
      <thead>
        <tr>
          <th>Sr</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Amount (₹)</th>
        </tr>
      </thead>
      <tbody id="billBody"></tbody>
    </table>

    <div class="total-box">
      <span>Total</span>
      <span id="totalAmount">₹0</span>
    </div>

    <div class="status-box" id="statusBox">
      ⏳ Waiting for weight verification...
    </div>

    <div class="warning-box" id="weightWarning">
      ⚠️ <b>Unusual weight detected</b><br>
      Difference: <span id="weightDiff">0</span> g
    </div>
  </div>

  <button class="payment-btn upi" disabled>📱 Pay via UPI</button>
  <button class="payment-btn card" disabled>💳 Pay via Card</button>
  <button class="payment-btn cash" disabled>💵 Pay with Cash</button>
  <button class="payment-btn pdf" disabled onclick="downloadInvoice()">📄 Download Invoice</button>

</div>

<script src="/Js/navigation.js"></script>

<script>
  /* ================= LOAD BILL ================= */
  const bill = JSON.parse(localStorage.getItem("bill")) || [];
  const total = localStorage.getItem("total") || 0;
  const sessionId = localStorage.getItem("session_id");

  if (!bill.length || !sessionId) {
    alert("Invalid session");
    goToHomePage();
  }

  const tbody = document.getElementById("billBody");
  bill.forEach((item, i) => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${item.name}</td>
      <td>${item.qty}</td>
      <td>₹${item.qty * item.price}</td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("totalAmount").innerText = "₹" + total;

  const buttons = document.querySelectorAll(".payment-btn");
  const warningBox = document.getElementById("weightWarning");
  const statusBox = document.getElementById("statusBox");
  const diffEl = document.getElementById("weightDiff");

  function enablePayment() {
    buttons.forEach(btn => btn.disabled = false);
    statusBox.innerText = "✅ Weight verified. You may proceed.";
    warningBox.style.display = "none";
  }

  function disablePayment(diff) {
    buttons.forEach(btn => btn.disabled = true);
    diffEl.innerText = diff;
    warningBox.style.display = "block";
    statusBox.innerText = "❌ Weight mismatch detected";
  }

  /* ================= CHECK VALIDATION (SESSION BASED) ================= */
async function checkValidation() {
  const sessionId = localStorage.getItem("session_id");
  if (!sessionId) return;

  const { data, error } = await supabase
    .from("validation")
    .select("*")
    .eq("session_id", sessionId)
    .order("created_at", { ascending: false })
    .limit(1)
    .maybeSingle(); 

  if (error) {
    console.log("⏳ Validation not ready yet");
    return;
  }

  if (!data) {
    console.log("⏳ Waiting for ESP32...");
    return;
  }

  if (data.verified === false) {
    document.getElementById("weightDiff").innerText = data.diff;
    document.getElementById("weightWarning").style.display = "block";
    disablePayment();
  } else {
    enablePayment();
  }
}

  /* 🔁 START POLLING ONLY ON PAYMENT PAGE */
  setInterval(checkValidation, 2000);

  /* ================= PDF ================= */
  function downloadInvoice() {
    html2pdf().from(document.getElementById("invoice")).save(
      `XYZ_Invoice_${Date.now()}.pdf`
    );
  }
</script>

</body>
</html>
