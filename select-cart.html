<!DOCTYPE html>
<html>
<head>
  <title>Select Cart</title>
</head>
<body>

<h2>Select Cart Number (1–8)</h2>

<select id="cartSelect">
  <option value="">-- Select Cart --</option>
  <option value="1">Cart 1</option>
  <option value="2">Cart 2</option>
  <option value="3">Cart 3</option>
  <option value="4">Cart 4</option>
  <option value="5">Cart 5</option>
  <option value="6">Cart 6</option>
  <option value="7">Cart 7</option>
  <option value="8">Cart 8</option>
</select>

<br><br>

<button onclick="confirmCart()">Continue</button>

<script>
function confirmCart() {
  const cartIdRaw = document.getElementById("cartSelect").value;

  if (!cartIdRaw) {
    alert("Please select a cart");
    return;
  }

  const cartId = parseInt(cartIdRaw, 10); // convert to integer

  if (Number.isNaN(cartId)) {
    alert("Invalid cart selected");
    return;
  }

  localStorage.setItem("cart_id", cartId); // still stored as string, but numeric string
  window.location.href = "scan.html";
}
</script>

</body>
</html>
