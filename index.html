<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>XYZ Smart Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Common CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="logo">🛒</div>
        <h1 class="store-title">XYZ Smart Store</h1>
        <p class="tagline">Fast • Secure • Smart Billing Experience</p>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Quick Scan</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Secure Pay</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">✨</div>
                <div class="feature-text">No Queues</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">5000+</div>
                <div class="stat-label">Products</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">30 sec</div>
                <div class="stat-label">Avg. Checkout</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">24/7</div>
                <div class="stat-label">Open</div>
            </div>
        </div>

        <div class="offers">
            <h3>🎉 Today's Hot Deals</h3>
            <div class="offer-item">
                <span class="offer-icon">🛒</span>
                <span class="offer-text">Buy 2 Get 1 Free on Snacks</span>
            </div>
            <div class="offer-item">
                <span class="offer-icon">🥛</span>
                <span class="offer-text">10% off on Dairy Products</span>
            </div>
            <div class="offer-item">
                <span class="offer-icon">🍫</span>
                <span class="offer-text">Flat ₹50 off above ₹999</span>
            </div>
        </div>

        <button class="btn btn-primary" onclick="goToScanPage()">
            Start Shopping →
        </button>

        <p class="footer-text">
            Scan • Pay • Exit — No Waiting ⏱️
        </p>
    </div>

    <!-- Navigation Logic -->
    <script src="Js/navigation.js"></script>

</body>

</html>
