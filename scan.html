<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan Products | XYZ Smart Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- QuaggaJS (Barcode Scanner Library) -->
  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
  
  <style>
    /* ===============================
       GLOBAL STYLES
    ================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 0;
      color: #222;
    }

    /* ===============================
       HEADER
    ================================ */
    header {
      background: linear-gradient(135deg, #203a43, #2c5364);
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* ===============================
       SCAN PAGE LAYOUT
    ================================ */
    .scanner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Scanner View */
    #scanner {
      width: 100%;
      max-width: 500px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #2c5364;
      background: black;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(20px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    /* Bill Section */
    h3 {
      font-size: 24px;
      font-weight: 700;
      margin: 20px 0 15px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    /* ===============================
       TABLE STYLES
    ================================ */
    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 25px;
      animation: fadeIn 0.6s ease-out;
    }

    th, td {
      padding: 12px 10px;
      font-size: 14px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: linear-gradient(135deg, #203a43, #2c5364);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    tbody tr {
      transition: background-color 0.2s ease;
    }

    tbody tr:hover {
      background-color: #f8f9fa;
    }

    .total-row {
      font-weight: bold;
      font-size: 18px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #2c5364;
    }

    .total-row td {
      border-bottom: none;
      padding: 15px 10px;
    }

    #totalAmount {
      color: #667eea;
      font-weight: 800;
      font-size: 20px;
    }

    /* ===============================
       BUTTON
    ================================ */
    .btn {
      width: 100%;
      max-width: 600px;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 20px;
      color: white;
      font-size: 14px;
      font-style: italic;
    }

    /* ===============================
       RESPONSIVE
    ================================ */
    @media (max-width: 480px) {
      header {
        font-size: 16px;
        padding: 12px;
      }

      .scanner-container {
        padding: 15px;
      }

      #scanner {
        height: 250px;
        max-width: 100%;
      }

      h3 {
        font-size: 20px;
      }

      th, td {
        font-size: 12px;
        padding: 8px 5px;
      }

      .btn {
        font-size: 16px;
        padding: 15px;
      }

      .total-row {
        font-size: 16px;
      }

      #totalAmount {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>🛒 Scan Products — XYZ Smart Store</header>

<div class="scanner-container">

  <button class="btn btn-primary" id="startCameraBtn">
    Start Camera
  </button>

  <!-- Camera View -->
  <div id="scanner"></div>

  <!-- Live Bill -->
  <h3>📝 Live Bill</h3>

  <table>
    <thead>
      <tr>
        <th>Sr.</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Price (₹)</th>
        <th>Weight</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="billBody">
      <!-- Bill items will appear here -->
    </tbody>
    <tfoot>
      <tr class="total-row">
        <td colspan="3">Total</td>
        <td colspan="2" id="totalAmount">₹0</td>
      </tr>
    </tfoot>
  </table>

  <button class="btn btn-primary" onclick="saveBillAndProceed()">
    💳 Proceed to Pay
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/Js/supabase.js"></script>

<!-- Navigation & Session Control -->
<script src="Js/navigation.js"></script>

<!-- Load JSON data -->
<script src="Js/dataLoader.js"></script>

<!-- Billing Logic -->
<script src="Js/bill.js"></script>

<!-- Scanner Logic -->
<script src="Js/scanner.js"></script>

<script>
  protectScanPage();

  const startBtn = document.getElementById("startCameraBtn");

  startBtn.addEventListener("click", async () => {
    try {
      // Force permission prompt first
      await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });

      // Now start Quagga AFTER permission
      startScanner();

      startBtn.style.display = "none";
    } catch (err) {
      alert("Camera permission denied or unavailable");
      console.error(err);
    }
  });
</script>




</body>
</html>
