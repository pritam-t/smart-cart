<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scan Products | XYZ Smart Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- QuaggaJS -->
  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

  <!-- ===============================
       STYLES (UNCHANGED)
  ================================ -->
  <style>
    /* (Your full existing CSS stays exactly the same) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #203a43, #2c5364);
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .scanner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    #scanner {
      width: 100%;
      max-width: 500px;
      height: 300px;
      border-radius: 16px;
      background: black;
      border: 3px solid #2c5364;
      margin-bottom: 30px;
    }

    h3 {
      color: white;
      margin: 20px 0;
    }

    table {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 16px;
      border-collapse: collapse;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #2c5364;
      color: white;
    }

    .total-row {
      font-weight: bold;
      background: #f5f7fa;
    }

    #totalAmount {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
    }

    .btn {
      width: 100%;
      max-width: 600px;
      padding: 18px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>🛒 Scan Products — XYZ Smart Store</header>

<div class="scanner-container">

  <button class="btn" id="startCameraBtn">Start Camera</button>

  <div id="scanner"></div>

  <h3>📝 Live Bill</h3>

  <table>
    <thead>
      <tr>
        <th>Sr.</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Price (₹)</th>
        <th>Weight</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="billBody"></tbody>
    <tfoot>
      <tr class="total-row">
        <td colspan="3">Total</td>
        <td colspan="3" id="totalAmount">₹0</td>
      </tr>
    </tfoot>
  </table>

  <button class="btn" id="proceedBtn">💳 Proceed to Pay</button>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/Js/supabase.js"></script>
<script src="Js/navigation.js"></script>
<script src="Js/dataLoader.js"></script>
<script src="Js/bill.js"></script>
<script src="Js/scanner.js"></script>

<script>
  /* ===============================
     PAGE PROTECTION
  ================================ */
  protectScanPage();

  /* ===============================
     CREATE SESSION (ONCE)
  ================================ */
  if (!localStorage.getItem("session_id")) {
    localStorage.setItem("session_id", crypto.randomUUID());
  }

  /* ===============================
     CAMERA START
  ================================ */
  const startBtn = document.getElementById("startCameraBtn");

  startBtn.addEventListener("click", async () => {
    try {
      await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      startScanner();
      startBtn.style.display = "none";
    } catch (err) {
      alert("Camera permission denied");
    }
  });

  /* ===============================
     PROCEED TO PAY (SAFE)
  ================================ */
  document.getElementById("proceedBtn").addEventListener("click", () => {

    if (!window.billItems || window.billItems.length === 0) {
      alert("Please scan at least one product");
      return;
    }

    stopScanner(); // 🔥 IMPORTANT: stop camera
    finalizeCartAndProceed();
  });

  /* ===============================
     CLEANUP
  ================================ */
  window.addEventListener("beforeunload", stopScanner);
</script>

</body>
</html>
